<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodly — MVP</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="logo-koi.svg" type="image/svg+xml" />
</head>
<body>
  <!-- ÜST BAŞLIK -->
  <header>
    <h1 class="brand">
      <img src="logo-koi.svg" alt="Moodly" class="logo" />
      <span class="badge">MVP</span>
    </h1>

    <!-- Karanlık Mod -->
    <label class="theme-toggle" title="Karanlık Mod">
      <input type="checkbox" id="themeToggle" />
      <span>🌙</span>
    </label>

    <!-- İçgörüler linki -->
    <a href="insights.html" class="insights-link">İçgörüler →</a>
  </header>

  <!-- HERO: arkaplan fotoğraflı -->
  <section class="hero" style="--hero-bg: url('bg-hero.png')">
    <div class="hero-copy">
      <h2>Gününü nazikçe yakala</h2>
      <p>1 dakikada ruh halini kaydet, haftalık içgörülerini gör.</p>
      <a href="insights.html" class="btn">İçgörülere git</a>
    </div>
  </section>

  <main>
    <!-- GÜNLÜK KAYIT -->
    <section class="card">
      <h2>Günlük Ruh Hali Kaydı</h2>

      <!-- Hatırlatma banner'ı -->
      <div id="reminder" class="reminder hidden">
        <div><strong>Bugün kayıt girmedin.</strong> Hadi 10 saniye ayıralım 😊</div>
        <div class="rem-actions">
          <button id="addNow" type="button" class="btn">Hemen ekle</button>
          <button id="dismissRem" type="button" class="btn btn-ghost">Kapat</button>
        </div>
      </div>

      <form id="moodForm">
        <label for="date">Tarih</label>
        <input type="date" id="date" required />

        <label for="score">Puan (1–5)</label>
        <input type="range" id="score" min="1" max="5" value="3" oninput="scoreOut.textContent=value" />
        <output id="scoreOut">3</output>

        <label for="emotion">Duygu</label>
        <select id="emotion">
          <option>Mutlu 😊</option>
          <option>Sakin 😌</option>
          <option>Endişeli 😟</option>
          <option>Üzgün 😔</option>
          <option>Öfkeli 😠</option>
          <option>Yorgun 😴</option>
        </select>

        <label for="note">Not</label>
        <textarea id="note" rows="3" placeholder="Bugün nasılsın?"></textarea>

        <button type="submit" class="btn">Kaydet</button>
      </form>
    </section>

    <!-- KAYITLAR -->
    <section class="card">
      <h2>Kayıtlar</h2>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <button id="exportCsv" class="btn" type="button">CSV Dışa Aktar</button>
        <input type="file" id="importCsv" accept=".csv" />
      </div>

      <div id="entries"></div>
      <button id="clearAll" class="btn btn-danger">Tümünü Sil</button>
    </section>
  </main>

  <footer>
    <small>
      Bu sürüm sadece tarayıcıda çalışır. Veriler cihazında tutulur.
    </small>
  </footer>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite">Kaydedildi ✅</div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
