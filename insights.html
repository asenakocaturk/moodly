<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodly — İçgörüler</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .grid{display:grid;gap:12px}
    .cols{grid-template-columns:1fr 1fr}
    .pill{display:inline-block;padding:4px 8px;border:1px solid var(--ring);border-radius:999px;margin:2px 6px 2px 0}
    .tag-good{background:#e8fff2;border-color:#c7f7da}
    .tag-bad{background:#fff1f2;border-color:#ffd5da}
    .tip{background:#f1f0ff;border:1px solid var(--ring);border-left:6px solid var(--accent);padding:12px;border-radius:10px}
    .card h3{margin:0 0 8px 0}
    .muted{color:var(--muted);font-size:14px}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
    .controls button{padding:6px 10px;border-radius:8px;border:1px solid var(--ring);background:#fff;cursor:pointer}
    .controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    textarea.small{width:100%;min-height:60px}
    .save-bar{display:flex;gap:8px;align-items:center;margin-top:6px}
  </style>
</head>
<body>
  <header>
    <h1>İçgörüler</h1>
    <a href="index.html" style="margin-left:auto">← Geri</a>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Haftalık / Aylık Özet</h2>
      <div class="controls">
        <button id="btn7"  class="active" type="button">Son 7 gün</button>
        <button id="btn30" type="button">Son 30 gün</button>
      </div>
      <canvas id="avgChart" height="140"></canvas>
      <div id="avgText" class="muted"></div>
    </section>

    <section class="card">
      <h2>En Sık Duygular</h2>
      <div id="topEmotions"></div>
    </section>

    <section class="card">
      <h2>Notlardan Kelime Haritası</h2>
      <div id="topWords" class="muted"></div>
    </section>

    <section class="card">
      <h2>Mini Koç (A + B + C)</h2>
      <div id="coach" class="grid"></div>
    </section>

    <section class="card">
      <h2>Kişisel Tetikleyici Kelimeler</h2>
      <p class="muted">Virgülle ayır. Örn: <em>uyku, kahve, toplantı, spor</em></p>
      <div class="grid cols">
        <div>
          <h3>Pozitif</h3>
          <textarea id="posWords" class="small" placeholder="enerji, odak, mutlu"></textarea>
        </div>
        <div>
          <h3>Negatif</h3>
          <textarea id="negWords" class="small" placeholder="stres, yorgun, uykusuz"></textarea>
        </div>
      </div>
      <div class="save-bar">
        <button id="saveWords" type="button">Kaydet</button>
        <span id="saveMsg" class="muted"></span>
      </div>
    </section>
  </main>

  <footer>
    <small class="muted">Veriler cihazındaki tarayıcıdan (localStorage) okunur; kimseye gönderilmez.</small>
  </footer>

<script>
// === Veri okuma ===
const STORAGE_KEY = "moodly_entries_v1";
function loadEntries(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
const ALL = loadEntries()
  .map(e=>({...e, ts: new Date(e.date+"T00:00:00")}))
  .sort((a,b)=>a.ts-b.ts);

// === Yardımcılar ===
function groupByDay(rows){
  const m = new Map();
  rows.forEach(e=>{
    const d = e.date;
    if(!m.has(d)) m.set(d, []);
    m.get(d).push(e.score);
  });
  const labels = [...m.keys()].sort();
  const scores = labels.map(d => Math.round(m.get(d).reduce((a,b)=>a+b,0)/m.get(d).length));
  return {labels, scores};
}
function lastNDays(rows, n){
  const byDay = groupByDay(rows);
  const start = Math.max(0, byDay.labels.length - n);
  return {
    labels: byDay.labels.slice(start),
    scores: byDay.scores.slice(start)
  };
}
function topEmotions(rows, n=5){
  const freq = {};
  rows.forEach(e=>{ freq[e.emotion] = (freq[e.emotion]||0) + 1; });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
const STOP = new Set(["ve","de","da","bir","çok","mi","mı","mu","mü","ile","ama","gibi","bu","şu","o","için","the","a","to","of","in","on","at","is","are"]);
function topWords(rows, n=15){
  const freq = {};
  rows.map(e=>(e.note||"").toLowerCase())
    .join(" ")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .split(/\s+/)
    .filter(w=>w && !STOP.has(w) && w.length>2)
    .forEach(w=>freq[w]=(freq[w]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

// === Kişisel kelimeler ===
const WKEY = "moodly_custom_words_v1";
function loadWordSets(){
  try { return JSON.parse(localStorage.getItem(WKEY)) || {pos:["enerji","odak","mutlu"], neg:["stres","yorgun","uyku"]}; }
  catch { return {pos:["enerji","odak","mutlu"], neg:["stres","yorgun","uyku"]}; }
}
function saveWordSets(posArr, negArr){
  localStorage.setItem(WKEY, JSON.stringify({pos:posArr, neg:negArr}));
}

// === Koç Mantığı (A+B+C) ===
function coachTips(rows){
  const {labels, scores} = lastNDays(rows, window._span || 7);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const trend = scores.length>1 ? (scores[scores.length-1]-scores[0]) : 0;
  const emos = topEmotions(rows,3).map(([k])=>k);
  const words = topWords(rows,30).map(([w])=>w);

  const {pos,neg} = loadWordSets();
  const goodHit = words.some(w=>pos.includes(w));
  const badHit  = words.some(w=>neg.includes(w));

  const tips = [];

  // A) self-therapy prompt
  if(avg < 3){
    tips.push(["Düşük ortalama", "Bu hafta zor geçmiş. Kendine 3 soru: 1) Enerjini ne tüketti? 2) Kontrol edebileceğin tek küçük şey? 3) Yarın bunu 10 dakikada nasıl denerim?"]);
  } else {
    tips.push(["Güçlü hafta", "İyi giden şeyi isimlendir: Hangi alışkanlık destek oldu? Bunu takvimine 10–15 dk mini blok olarak ekle."]);
  }

  // B) mood ↔ productivity (notlardan sezgi)
  if(badHit){
    tips.push(["Üretkenlik freni", "Notlarda negatif işaretler var. Yarın 15 dk 'yavaş başla': su + 2 dk nefes + 5 dk tek görev listesi."]);
  }
  if(goodHit){
    tips.push(["Hızlandırıcı", "Pozitif tetikleyiciler var. Aynı saatte 20 dk 'tek görev' odak bloğu planla."]);
  }

  // C) duygusal farkındalık
  if(emos.length){
    tips.push(["Baskın duygu", `Sık görülen: ${emos.join(", ")}. Bu duygular hangi durumlarda tetikleniyor? Notlarına 3 örnek yaz.`]);
  }

  if(trend < 0) tips.push(["Trend ↓", "Hafta başına göre düşüş var. 7 saat uyku, 2 litre su, 20 dk yürüyüş hedefi koy."]);
  if(trend > 0) tips.push(["Trend ↑", "Gidişat iyi. Aynı saatlerde kayıt tut; ritim güçlendirir."]);

  return { labels, scores, avg, trend, tips, words };
}

// === Çizim & Render ===
let chart;
function render(span=7){
  window._span = span;
  const rows = ALL; // ileride filtreler ekleyebiliriz

  const ctx = document.getElementById("avgChart");
  const {labels, scores, avg, trend, tips} = coachTips(rows);

  if(chart) chart.destroy();
  chart = new Chart(ctx, {
    type:"line",
    data:{ labels, datasets:[{label:"Günlük Ortalama", data:scores, tension:.35}] },
    options:{ responsive:true, scales:{ y:{min:1,max:5,ticks:{stepSize:1}} } }
  });

  const avgText = document.getElementById("avgText");
  avgText.textContent = scores.length ? `Ortalama: ${avg.toFixed(2)} / 5. Trend: ${trend>0?"↑":trend<0?"↓":"→"}` : "Henüz yeterli veri yok.";

  const emos = topEmotions(rows,5);
  document.getElementById("topEmotions").innerHTML =
    emos.length ? emos.map(([e,c])=>`<span class="pill">${e} • ${c}</span>`).join("") :
    `<div class="muted">Henüz veri yok.</div>`;

  const words = topWords(rows,30);
  document.getElementById("topWords").innerHTML =
    words.length ? words.map(([w,c])=>`<span class="pill ${loadWordSets().pos.includes(w)?"tag-good":(loadWordSets().neg.includes(w)?"tag-bad":"")}">${w} • ${c}</span>`).join("") :
    `<div class="muted">Not ekleyince burada en sık kelimeler görünecek.</div>`;

  document.getElementById("coach").innerHTML =
    tips.map(([title,text])=>`<div class="tip"><h3>${title}</h3><div>${text}</div></div>`).join("");
}

// === Kontroller ===
document.getElementById("btn7").addEventListener("click", ()=>{
  document.getElementById("btn7").classList.add("active");
  document.getElementById("btn30").classList.remove("active");
  render(7);
});
document.getElementById("btn30").addEventListener("click", ()=>{
  document.getElementById("btn30").classList.add("active");
  document.getElementById("btn7").classList.remove("active");
  render(30);
});

// === Kişisel kelimeler yükle / kaydet ===
(function initWords(){
  const {pos,neg} = loadWordSets();
  document.getElementById("posWords").value = pos.join(", ");
  document.getElementById("negWords").value = neg.join(", ");
})();
document.getElementById("saveWords").addEventListener("click", ()=>{
  const pos = document.getElementById("posWords").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  const neg = document.getElementById("negWords").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  saveWordSets(pos,neg);
  document.getElementById("saveMsg").textContent = "Kaydedildi ✅";
  setTimeout(()=>document.getElementById("saveMsg").textContent="", 1500);
  render(window._span || 7);
});

// === Başlat ===
render(7);
</script>
</body>
</html>
