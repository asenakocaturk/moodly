<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodly — İçgörüler</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .grid{display:grid;gap:12px}
    .cols{grid-template-columns:1fr 1fr}
    .pill{display:inline-block;padding:4px 8px;border:1px solid var(--ring);border-radius:999px;margin:2px 6px 2px 0}
    .tag-good{background:#e8fff2;border-color:#c7f7da}
    .tag-bad{background:#fff1f2;border-color:#ffd5da}
    .tip{background:#f1f0ff;border:1px solid var(--ring);border-left:6px solid var(--accent);padding:12px;border-radius:10px}
    .card h3{margin:0 0 8px 0}
    .muted{color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <header>
    <h1>İçgörüler</h1>
    <a href="index.html" style="margin-left:auto">← Geri</a>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Haftalık Özet</h2>
      <canvas id="avgChart" height="140"></canvas>
      <div id="avgText" class="muted"></div>
    </section>

    <section class="card">
      <h2>En Sık Duygular</h2>
      <div id="topEmotions"></div>
    </section>

    <section class="card">
      <h2>Notlardan Kelime Haritası</h2>
      <div id="topWords" class="muted"></div>
    </section>

    <section class="card">
      <h2>Mini Koç (A + B + C)</h2>
      <div id="coach" class="grid"></div>
    </section>
  </main>

  <footer>
    <small class="muted">Veriler cihazındaki tarayıcıdan (localStorage) okunur; kimseye gönderilmez.</small>
  </footer>

<script>
// === Basit veri okuma ===
const STORAGE_KEY = "moodly_entries_v1";
function loadEntries(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
const entries = loadEntries()
  .map(e=>({...e, ts: new Date(e.date+"T00:00:00")}))
  .sort((a,b)=>a.ts-b.ts);

// === Haftalık ortalama ===
function getLastNDays(days=7){
  const set = new Map();
  entries.forEach(e=>{
    if(!set.has(e.date)) set.set(e.date, []);
    set.get(e.date).push(e.score);
  });
  const labels = [...set.keys()].sort().slice(-days);
  const scores = labels.map(d=>{
    const arr = set.get(d);
    return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  });
  return { labels, scores };
}

// === En sık duygular ===
function topEmotions(n=3){
  const freq = {};
  entries.forEach(e=>{ freq[e.emotion] = (freq[e.emotion]||0) + 1; });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

// === Not kelimeleri (çok basit filtre) ===
const STOP = new Set(["ve","de","da","bir","çok","mi","mı","mu","mü","ile","ama","gibi","bu","şu","o","için","the","a","to","of","in","on","at","is","are"]);
function topWords(n=15){
  const freq = {};
  entries.map(e=>(e.note||"").toLowerCase())
    .join(" ")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .split(/\s+/)
    .filter(w=>w && !STOP.has(w) && w.length>2)
    .forEach(w=>freq[w]=(freq[w]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

// === Koç mantığı (A+B+C birlikte) ===
function coachTips(){
  const {labels, scores} = getLastNDays(7);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const trend = scores.length>1 ? (scores[scores.length-1] - scores[0]) : 0;
  const emos = topEmotions(3).map(([k])=>k);
  const words = topWords(15).map(([w])=>w);

  const goodWords = ["tamam","başardım","bitirdim","enerji","mutlu","rahat","odak"];
  const badWords  = ["yorgun","stres","gece","uyku","geciktirdim","kaygı","hastayım","baş ağrısı"];
  const goodHit = words.some(w=>goodWords.includes(w));
  const badHit  = words.some(w=>badWords.includes(w));

  const tips = [];

  // A) self-therapy prompt
  if(avg < 3){
    tips.push(["Düşük ortalama", "Bu hafta zor geçmiş. Kendine şu 3 soruyu sor: 1) En çok ne tüketti enerjini? 2) Kontrol edebileceğin tek küçük şey ne? 3) Yarın bunu 10 dakikada nasıl denerim?"]);
  } else {
    tips.push(["Güçlü hafta", "İyi giden şeyi isimlendir: Hangi alışkanlık destek oldu? Bunu takvimine mini blok olarak ekle (10–15 dk)."]);
  }

  // B) mood ↔ productivity (notlardan sezgi)
  if(badHit){
    tips.push(["Üretkenlik freni", "Notlarda 'uyku/stres/yorgunluk' izi var. Yarın 15 dk ekran öncesi 'yavaş başla' (su + nefes + 5 dk görev listesi)."]);
  }
  if(goodHit){
    tips.push(["Hızlandırıcı", "Pozitif kelimeler var. Bu hissi çoğalt: günün aynı saatine 20 dk 'tek görev' odak bloğu koy."]);
  }

  // C) duygusal farkındalık
  if(emos.length){
    tips.push(["Baskın duygu", `Sık görülen: ${emos.join(", ")}. Bu duygular hangi durumlarda tetikleniyor? Notlara 3 örnek cümle ekle.`]);
  }

  // Trend yorumu
  if(trend < 0) tips.push(["Trend ↓", "Hafta başına göre düşüş var. 7 saat uyku hedefi, 2 litre su ve 20 dk yürüyüş ekle."]);
  if(trend > 0) tips.push(["Trend ↑", "Gidişat iyi. Aynı saatlerde kayıt tut; düzen ritim oluşturuyor."]);

  return { avg, trend, tips, words };
}

// === Ekrana bas ===
(function render(){
  const {labels, scores} = getLastNDays(7);
  const ctx = document.getElementById("avgChart");
  new Chart(ctx, {
    type:"line",
    data:{ labels, datasets:[{label:"Günlük Ortalama", data:scores, tension:.35}] },
    options:{ responsive:true, scales:{ y:{min:1,max:5,ticks:{stepSize:1}} } }
  });

  // Ortalama metni
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2) : "—";
  const trend = scores.length>1 ? (scores[scores.length-1]-scores[0]) : 0;
  document.getElementById("avgText").textContent =
    `Ortalama: ${avg} / 5. Trend: ${trend>0?"↑":trend<0?"↓":"→"}`;

  // Duygular
  const emos = topEmotions(5);
  document.getElementById("topEmotions").innerHTML =
    emos.length ? emos.map(([e,c])=>`<span class="pill">${e} • ${c}</span>`).join("") :
    `<div class="muted">Henüz veri yok.</div>`;

  // Kelimeler
  const words = topWords(15);
  document.getElementById("topWords").innerHTML =
    words.length ? words.map(([w,c])=>`<span class="pill ${["mutlu","enerji","odak"].includes(w)?"tag-good":(["stres","yorgun","uyku"].includes(w)?"tag-bad":"")}">${w} • ${c}</span>`).join("") :
    `<div class="muted">Not ekleyince burada en sık kelimeler görünecek.</div>`;

  // Koç
  const { tips } = coachTips();
  document.getElementById("coach").innerHTML =
    tips.map(([title,text])=>`<div class="tip"><h3>${title}</h3><div>${text}</div></div>`).join("");
})();
</script>
</body>
</html>
